# AegisSOC overrides for upstream wazuh-docker single-node (see stack.lock.json).
# Requires Docker Compose >= 2.24.4 for the !override tag.
# AEGIS_RUNTIME_DIR is injected by the `aegis` CLI; secrets come from the repo-root .env.
services:
  wazuh.manager:
    ports: !override
      - "${AEGIS_AGENT_BIND:-127.0.0.1}:1514:1514"
      - "${AEGIS_AGENT_BIND:-127.0.0.1}:1515:1515"
      - "127.0.0.1:55000:55000"
    environment:
      - INDEXER_PASSWORD=${INDEXER_ADMIN_PASSWORD:?run aegis init-secrets}
      - API_PASSWORD=${WAZUH_API_WUI_PASSWORD:?run aegis init-secrets}
    volumes:
      - ${AEGIS_RUNTIME_DIR:?run via aegis CLI}/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ${AEGIS_RUNTIME_DIR:?run via aegis CLI}/authd.pass:/wazuh-config-mount/etc/authd.pass:ro
      # Serve the API with the stack-CA-signed manager cert so tooling can verify TLS.
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/wazuh-config-mount/api/configuration/ssl/server.crt:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/wazuh-config-mount/api/configuration/ssl/server.key:ro
    mem_limit: 3g

  wazuh.indexer:
    ports: !override
      - "127.0.0.1:9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - ${AEGIS_RUNTIME_DIR:?run via aegis CLI}/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    mem_limit: 2560m

  wazuh.dashboard:
    ports: !override
      - "127.0.0.1:${AEGIS_DASHBOARD_PORT:-5601}:5601"
    environment:
      - INDEXER_PASSWORD=${INDEXER_ADMIN_PASSWORD:?run aegis init-secrets}
      - DASHBOARD_PASSWORD=${INDEXER_KIBANASERVER_PASSWORD:?run aegis init-secrets}
      - API_PASSWORD=${WAZUH_API_WUI_PASSWORD:?run aegis init-secrets}
    volumes:
      - ${AEGIS_RUNTIME_DIR:?run via aegis CLI}/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    mem_limit: 1g
