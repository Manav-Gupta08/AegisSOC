<agent_config>
  <!-- AegisSOC group "linux". Applied with `aegis agent-config apply`; see docs/telemetry.md. -->
  <!-- No audit.log source: kernel audit is unavailable on the WSL2 endpoint (verified 2026-10-13). -->

  <syscheck>
    <!-- Watch directories, not files: tools like groupadd/visudo replace files atomically, which
         silently ends real-time watches on the file itself (verified 2026-10-13, M2-LNX-002).
         No whodata: kernel audit is unavailable on WSL2. -->
    <directories check_all="yes" realtime="yes">/etc</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/sudoers.d,/etc/cron.d,/etc/systemd/system,/etc/profile.d,/etc/ssh/sshd_config.d</directories>
    <directories check_all="yes" realtime="yes">/var/spool/cron/crontabs,/root/.ssh</directories>
    <nodiff type="sregex">^/etc/(g?shadow|ssh/ssh_host_.*_key)$</nodiff>
  </syscheck>
</agent_config>
