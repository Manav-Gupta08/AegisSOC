name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit
      # Structural validation only; CI never deploys rules or configs to a live stack.
      - run: aegis detections validate
      - run: aegis agent-config validate
      - run: aegis scenarios validate
      - run: aegis playbooks validate
      - run: aegis telemetry --validate

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shell scripts (bash -n, shellcheck)
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          shellcheck $(git ls-files '*.sh')
      - name: PowerShell scripts parse without errors
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in git ls-files '*.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Output "${f}:$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans full history, not just the latest commit.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
